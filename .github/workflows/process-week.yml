name: Process NFL Week Results

on:
  workflow_dispatch:
    inputs:
      season:
        description: "NFL season"
        required: true
        type: string
      week:
        description: "NFL week (1-18)"
        required: true
        type: string

run-name: "Process NFL Results — Season ${{ inputs.season }} Week ${{ inputs.week }}"

concurrency:
  group: process-nfl-week-${{ inputs.season }}-${{ inputs.week }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Check season and week
        env:
          SEASON: ${{ inputs.season }}
          WEEK: ${{ inputs.week }}
        run: |
          if ! [[ "$SEASON" =~ ^[0-9]{4}$ ]]; then
            echo "Invalid season: $SEASON"
            exit 1
          fi

          if ! [[ "$WEEK" =~ ^([1-9]|1[0-8])$ ]]; then
            echo "Invalid week: $WEEK"
            exit 1
          fi

          # The Admin trigger is currently restricted to the 2026 season.
          if [ "$SEASON" != "2026" ]; then
            echo "Admin-triggered processing is restricted to season 2026."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production results processor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/syncGameResults.js \
            --season="${{ inputs.season }}" \
            --week="${{ inputs.week }}"
